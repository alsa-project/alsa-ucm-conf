# Use case configuration for mt8186-mt6366-rt1019-rt5682s
#
# SOF frontends (see the mt8186-mt6366 machine driver):
#   SOF_DL1 hw:x,25 -> I2S1 -> rt5682s headphones
#   SOF_DL2 hw:x,26 -> I2S3 -> rt1019 speaker
#   SOF_UL1 hw:x,27 -> mt6366 built-in DMIC
#   SOF_UL2 hw:x,28 -> I2S0 -> rt5682s headset mic

SectionVerb {
	EnableSequence [
		disdevall ""
	]

	Value.TQ "HiFi"
}

SectionDevice."Speaker" {
	Comment "Speaker"

	EnableSequence [
		cset "name='I2S3_CH1 DL2_CH1 Switch' on"
		cset "name='I2S3_CH2 DL2_CH2 Switch' on"
		cset "name='Speakers Switch' on"
	]

	DisableSequence [
		cset "name='Speakers Switch' off"
		cset "name='I2S3_CH1 DL2_CH1 Switch' off"
		cset "name='I2S3_CH2 DL2_CH2 Switch' off"
	]

	Value {
		PlaybackChannels 2
		PlaybackPCM "hw:${CardId},26"
		PlaybackPriority 100
	}
}

SectionDevice."Headphones" {
	Comment "Headphones"

	EnableSequence [
		cset "name='Headphone Switch' on"
	]

	If.is_rt5682i_hp {
		Condition {
			Type ControlExists
			Control "name='HPOL Playback Switch'"
		}
		True {
			EnableSequence [
				cset "name='HPOL Playback Switch' 1"
				cset "name='HPOR Playback Switch' 1"
			]

			DisableSequence [
				cset "name='HPOL Playback Switch' 0"
				cset "name='HPOR Playback Switch' 0"
			]
		}
	}

	DisableSequence [
		cset "name='Headphone Switch' off"
	]

	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},25"
		JackControl "Headphone Jack"
	}
}

SectionDevice."Headset" {
	Comment "Headset Microphone"

	EnableSequence [
		cset "name='UL2_CH1 I2S0_CH1 Switch' on"
		cset "name='UL2_CH2 I2S0_CH2 Switch' on"
		cset "name='Headset Mic Switch' on"
		cset "name='STO1 ADC Capture Switch' 1"
		cset "name='RECMIX1L CBJ Switch' 1"
		cset "name='Stereo1 ADC MIXL ADC1 Switch' 1"
		cset "name='Stereo1 ADC MIXR ADC1 Switch' 1"
		cset "name='CBJ Boost Volume' 8"
		cset "name='STO1 ADC Boost Gain Volume' 2"
		cset "name='STO1 ADC Capture Volume' 44"
	]

	DisableSequence [
		cset "name='STO1 ADC Capture Volume' 26"
		cset "name='STO1 ADC Boost Gain Volume' 0"
		cset "name='CBJ Boost Volume' 3"
		cset "name='Stereo1 ADC MIXL ADC1 Switch' 0"
		cset "name='Stereo1 ADC MIXR ADC1 Switch' 0"
		cset "name='RECMIX1L CBJ Switch' 0"
		cset "name='STO1 ADC Capture Switch' 0"
		cset "name='Headset Mic Switch' off"
		cset "name='UL2_CH1 I2S0_CH1 Switch' off"
		cset "name='UL2_CH2 I2S0_CH2 Switch' off"
	]

	Value {
		CapturePriority 200
		CapturePCM "hw:${CardId},28"
		JackControl "Headset Mic Jack"
	}
}

SectionDevice."Mic" {
	Comment "Internal Microphone"

	EnableSequence [
		cset "name='Mt6366 Dmic Mode Switch' on"
		cset "name='Mt6366 Mic Type Mux' DMIC"
		cset "name='UL1_CH1 ADDA_UL_CH1 Switch' on"
		cset "name='UL1_CH2 ADDA_UL_CH2 Switch' on"
	]

	DisableSequence [
		cset "name='UL1_CH1 ADDA_UL_CH1 Switch' off"
		cset "name='UL1_CH2 ADDA_UL_CH2 Switch' off"
		cset "name='Mt6366 Mic Type Mux' Idle"
	]

	Value {
		CapturePCM "hw:${CardId},27"
		CapturePriority 100
	}
}
