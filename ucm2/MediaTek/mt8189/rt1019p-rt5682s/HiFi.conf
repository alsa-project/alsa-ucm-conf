# Use case configuration for mt8189-rt1019p-rt5682s

SectionVerb {
	EnableSequence [
		disdevall ""
	]

	Value.TQ "HiFi"
}

SectionDevice."Speaker" {
	Comment "Speaker"

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
	}
}

SectionDevice."Headphones" {
	Comment "Headphones"

	EnableSequence [
		cset "name='Headphone Jack Switch' 1"
		cset "name='Stereo1 DAC MIXL DAC L1 Switch' 1"
		cset "name='Stereo1 DAC MIXR DAC R1 Switch' 1"
	]

	DisableSequence [
		cset "name='Stereo1 DAC MIXL DAC L1 Switch' 0"
		cset "name='Stereo1 DAC MIXR DAC R1 Switch' 0"
		cset "name='Headphone Jack Switch' 0"
	]

	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},1"
		JackControl "Headphone Jack"
	}
}

SectionDevice."Mic" {
	Comment "Internal Microphone"

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},2"
	}
}

SectionDevice."Headset" {
	Comment "Headset Microphone"

	EnableSequence [
		cset "name='RECMIX1L CBJ Switch' 1"
		cset "name='RECMIX1R CBJ Switch' 1"
		cset "name='Stereo1 ADC L1 Mux' 1"
		cset "name='Stereo1 ADC R1 Mux' 1"
		cset "name='Stereo1 ADC MIXL ADC1 Switch' 1"
		cset "name='Stereo1 ADC MIXR ADC1 Switch' 1"
	]

	DisableSequence [
		cset "name='RECMIX1L CBJ Switch' 0"
		cset "name='RECMIX1R CBJ Switch' 0"
		cset "name='Stereo1 ADC L1 Mux' 0"
		cset "name='Stereo1 ADC R1 Mux' 0"
		cset "name='Stereo1 ADC MIXL ADC1 Switch' 0"
		cset "name='Stereo1 ADC MIXR ADC1 Switch' 0"
	]

	Value {
		CapturePriority 200
		CapturePCM "hw:${CardId},3"
		JackControl "Headset Mic Jack"
	}
}

# HDMI and DisplayPort only where the board's DT links a codec to the HDMI/DP back ends (the machine driver then
# creates their jacks)

If.hdmi {
	Condition {
		Type ControlExists
		Control "iface=CARD,name='HDMI Jack'"
	}
	True.SectionDevice."HDMI1" {
		Comment "HDMI"

		Value {
			PlaybackPriority 50
			PlaybackPCM "hw:${CardId},6"
			PlaybackChannels 2
			JackControl "HDMI Jack"
		}
	}
}

If.dp {
	Condition {
		Type ControlExists
		Control "iface=CARD,name='DP Jack'"
	}
	True.SectionDevice."HDMI2" {
		Comment "DisplayPort"

		Value {
			PlaybackPriority 40
			PlaybackPCM "hw:${CardId},5"
			PlaybackChannels 2
			JackControl "DP Jack"
		}
	}
}
