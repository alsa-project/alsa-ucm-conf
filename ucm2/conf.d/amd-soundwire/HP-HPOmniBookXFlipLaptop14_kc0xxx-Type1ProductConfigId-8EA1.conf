Syntax 8

# Board-specific profile for the HP 8EA1 AMD SoundWire topology:
# two TAS2783 speaker amplifiers plus an RT712 headset/DMIC codec.
SectionUseCase."HiFi" {
	File "/HP/8EA1/HiFi.conf"
	Comment "Play HiFi quality Music"
}

Include.led.File "/common/ctl/led.conf"
Include.card-init.File "/lib/card-init.conf"

Define {
	SpeakerCodec1 "tas2783"
	SpeakerChannels1 "2"
	SpeakerAmps1 "2"
	HeadsetCodec1 "rt712"
	MicCodec1 "rt712"
}

Include.rt712-init.File "/codecs/rt712/init.conf"
