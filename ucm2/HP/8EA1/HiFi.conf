# Use case configuration for the HP 8EA1 AMD SoundWire card.

SectionVerb {
	EnableSequence [
		disdevall ""
	]

	Value.TQ "HiFi"
}

SectionDevice."Speaker" {
	Comment "Internal Speakers"

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},2"
	}
}

# The stock RT712 definition supplies headphones, headset mic, and the
# integrated SoundWire microphone paths. The board profile selects only
# those RT712 functions and exposes the TAS2783 pair as the speaker.
Include.rt712.File "/sof-soundwire/rt712.conf"
