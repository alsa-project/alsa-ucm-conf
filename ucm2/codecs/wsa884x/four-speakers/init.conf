# WSA884x in four-speaker configuration, specific volume control settings
LibraryConfig.remap.Config {
	ctl.default.map {
		# Merge four mono controls into one
		"name='Speakers Volume'" {
			"name='WooferLeft PA Volume'".vindex.0 0
			"name='TweeterLeft PA Volume'".vindex.1 0
			"name='WooferRight PA Volume'".vindex.2 0
			"name='TweeterRight PA Volume'".vindex.3 0
		}
	}
}

# Old kernel versions do not support the WSA884x "Speaker Switch" mute control
If.speaker-switch {
	Condition {
		Type ControlExists
		Control "name='WooferLeft Speaker Switch'"
	}
	True {
		LibraryConfig.remap.Config {
			ctl.default.map {
				# Merge four mono controls into one
				"name='Speakers Switch'" {
					"name='WooferLeft Speaker Switch'".vindex.0 0
					"name='TweeterLeft Speaker Switch'".vindex.1 0
					"name='WooferRight Speaker Switch'".vindex.2 0
					"name='TweeterRight Speaker Switch'".vindex.3 0
				}
			}
		}
	}
}

