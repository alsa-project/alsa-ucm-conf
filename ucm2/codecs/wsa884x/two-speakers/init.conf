# WSA884x in two-speaker configuration, specific volume control settings
LibraryConfig.remap.Config {
	ctl.default.map {
		# Merge two mono controls into one stereo
		"name='Speakers Volume'" {
			"name='SpkrLeft PA Volume'".vindex.0 0
			"name='SpkrRight PA Volume'".vindex.1 0
		}
	}
}

# Old kernel versions do not support the WSA884x "Speaker Switch" mute control
If.speaker-switch {
	Condition {
		Type ControlExists
		Control "name='SpkrLeft Speaker Switch'"
	}
	True {
		LibraryConfig.remap.Config {
			ctl.default.map {
				# Merge two mono controls into one stereo
				"name='Speakers Switch'" {
					"name='SpkrLeft Speaker Switch'".vindex.0 0
					"name='SpkrRight Speaker Switch'".vindex.1 0
				}
			}
		}
	}
}
