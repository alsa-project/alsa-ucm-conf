# tas2783 specific switch control settings

BootSequence [
	cset "name='Left Spk' on"
	cset "name='Right Spk' on"
	cset "name='Left Spk2' on"
	cset "name='Right Spk2' on"
]
Macro [
	{ SetLED { LED="speaker" Action="attach" CtlId="Left Spk Switch" } }
	{ SetLED { LED="speaker" Action="attach" CtlId="Right Spk Switch" } }
	{ SetLED { LED="speaker" Action="attach" CtlId="Left Spk2 Switch" } }
	{ SetLED { LED="speaker" Action="attach" CtlId="Right Spk2 Switch" } }
]

