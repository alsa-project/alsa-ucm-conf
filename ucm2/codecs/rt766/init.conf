# RT766 specific volume control settings

BootSequence [
	cset "name='rt766 FU41 Playback Volume' 127"
	cset "name='rt766 FU21 Playback Volume' 87"
	cset "name='rt766 FU36 Capture Volume' 57"
	cset "name='rt766 FU36 Capture Switch' 1"
	cset "name='rt766 FU113 Capture Switch' 1"
	cset "name='rt766 FU113 Capture Volume' 63"
]

Macro [
	{ SetLED { LED="mic" Action="attach" CtlId="rt766 FU113 Capture Switch" } }
	{ SetLED { LED="speaker" Action="attach" CtlId="rt766 FU21 Playback Switch" } }
]

