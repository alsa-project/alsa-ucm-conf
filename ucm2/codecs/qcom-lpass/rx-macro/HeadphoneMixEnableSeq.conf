# Headphone playback through the interpolator mix path (RX2/RX3)

EnableSequence [
	cset "name='RX_HPH PWR Mode' LOHIFI"
	cset "name='RX_MACRO RX2 MUX' AIF1_PB"
	cset "name='RX_MACRO RX3 MUX' AIF1_PB"
	cset "name='RX INT0_2 MUX' RX2"
	cset "name='RX INT1_2 MUX' RX3"
	cset "name='RX INT0 DEM MUX' CLSH_DSM_OUT"
	cset "name='RX INT1 DEM MUX' CLSH_DSM_OUT"
]
