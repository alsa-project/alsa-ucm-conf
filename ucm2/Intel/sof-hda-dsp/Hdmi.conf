# Use case Configuration for sof-hda-dsp

Include.hdmi.File "/codecs/hda/hdmi.conf"

If.hdmi1 {
	Condition { Type AlwaysTrue }
	True.Macro.hdmi1.HDMI {
		Number 1
		Device 3
		Priority 500
	}
}

If.hdmi2 {
	Condition { Type AlwaysTrue }
	True.Macro.hdmi1.HDMI {
		Number 2
		Device 4
		Priority 600
	}
}

If.hdmi3 {
	Condition { Type AlwaysTrue }
	True.Macro.hdmi1.HDMI {
		Number 3
		Device 5
		Priority 700
	}
}

If.t14sg2 {
	Condition {
		Type RegexMatch
		String "${CardLongName}"
		Regex "LENOVO-*-ThinkPadT14sGen2i"
	}
	True {
		SectionDevice."HDMI1" {
			Comment "HDMI Output"
		}
		SectionDevice."HDMI2" {
			Comment "USB-C DisplayPort Output"
		}
	}
}
