# Use case Configuration for LENOVO-21JN00DLSC-ThinkPadE16Gen1 (sof-hda-dsp)
#
# Layers on top of the generic sof-hda-dsp HiFi verb (Headphones/Speaker from
# /HDA/HiFi-analog.conf, Mic:hda from /HDA/HiFi-mic.conf, Mic:sof-dsp and
# Hdmi1/2/3 from /Intel/sof-hda-dsp/HiFi.conf) and only amends what this
# board's Conexant CX11880 codec needs:
#
# - Headphones/Speaker are not marked as mutually exclusive by the generic
#   file, so ACP enumerates them as two separate profiles instead of two
#   ports of one profile. Add ConflictingDevice both ways to fix that.
# - This codec has no Input Source/Capture Source enum and no
#   Internal Mic Boost Volume control, so the generic mic heuristic
#   (HDA/HiFi-mic.conf) falls back to its plain-switches branch and wires
#   Mic:hda to nonexistent "Mic Switch"/"Mic Volume" controls. Point it at
#   the real Capture Volume/Capture Switch/Mic Boost controls instead.

Syntax 8

Include.top.File "/Intel/sof-hda-dsp/HiFi.conf"

SectionDevice."Headphones" {
	ConflictingDevice [
		"Speaker"
	]
}

SectionDevice."Speaker" {
	ConflictingDevice [
		"Headphones"
	]
}

SectionDevice."Mic:hda" {
	Value {
		CaptureVolume "Capture Volume"
		CaptureSwitch "Capture Switch"
		CaptureMasterElem "Mic Boost"
	}
}
