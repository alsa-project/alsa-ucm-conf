# Lenovo ThinkPad E16 Gen 1 (Intel), model 21JN00DLSC
# skl_hda_dsp_generic / sof-hda-generic-2ch.tplg, Conexant CX11880
#
# Reuses the generic sof-hda-dsp chain (LED/card-init/dsp variables, HDMI,
# SOF DMIC) and only overrides the HiFi verb content to fix Headphones/
# Speaker/Mic device wiring for this board. See
# /Intel/sof-hda-dsp/LENOVO-21JN00DLSC-ThinkPadE16Gen1-HiFi.conf

Syntax 8

Include.base.File "sof-hda-dsp.conf"

SectionUseCase."HiFi" {
	File "/Intel/sof-hda-dsp/LENOVO-21JN00DLSC-ThinkPadE16Gen1-HiFi.conf"
	Comment "Play HiFi quality Music"
}
