# HDMI converters on renamed AVS HDMI cards map HDMI1→PCM 0,
# HDMI2→PCM 1, HDMI3→PCM 2. codecs/hda/hdmi.conf names the jack
# "HDMI/DP" when Device is 0, and "HDMI/DP,pcm=N" otherwise. It
# also programs IEC958 Playback Switch at index (Number - 1), so
# Number must be 1-based (Number 0 yields index -1).
#
# Live-tested on Acer Swift SF514-52T (Kaby Lake HDMI, three
# converters). The HDMI macro skips a converter whose jack control
# is missing.

Include.hdmi.File "/codecs/hda/hdmi.conf"

If.hdmi1 {
	Condition { Type AlwaysTrue }
	True.Macro.hdmi1.HDMI {
		Number 1
		Device 0
		Priority 1000
	}
}

If.hdmi2 {
	Condition { Type AlwaysTrue }
	True.Macro.hdmi2.HDMI {
		Number 2
		Device 1
		Priority 1001
	}
}

If.hdmi3 {
	Condition { Type AlwaysTrue }
	True.Macro.hdmi3.HDMI {
		Number 3
		Device 2
		Priority 1002
	}
}
