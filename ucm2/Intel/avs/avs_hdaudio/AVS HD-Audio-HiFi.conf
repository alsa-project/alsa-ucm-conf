# Analog speaker, headphone, and headset-mic devices for AVS HD-Audio.
# HiFi-analog.conf matches Speaker / Headphone mixer controls. Analog
# capture has no Capture Switch on some BIOS (Realtek ALC255 pins left
# N/A under snd_soc_avs), so HiFi-mic.conf is skipped. AVS topology
# still exposes pcmC*D0c (HDAudio Analog). Bind that PCM as Headset
# when the combo jack exists.
#
# Live-tested on Acer Swift SF514-52T (ALC255, PCI 8086:9d71 /
# subsystem 1025:1225). Analog capture is 24-bit left-justified in
# S32_LE. Pin retask is a kernel / hwdep concern; this file only
# describes the PCM and jack.

Define.DeviceMic "Mic"

Include.analog.File "/HDA/HiFi-analog.conf"

If.headset {
	Condition {
		Type ControlExists
		Control "iface=CARD,name='Front Headphone Jack'"
	}
	True.SectionDevice."Headset" {
		Comment "Headset Microphone"

		Value {
			CapturePriority 150
			CapturePCM "hw:${CardId},0"
			CaptureChannels 2
			CaptureRate 48000
			CaptureFormat "S32_LE"
			JackControl "Front Headphone Jack"
			JackDev "hw:${CardId}"
		}
	}
}
