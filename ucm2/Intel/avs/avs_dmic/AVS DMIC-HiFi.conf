# Renamed AVS DMIC card (long name "AVS DMIC"): PCM is device 0.
# This NHLT is stereo 48 kHz. ACP assumes stereo when CaptureChannels
# is omitted and fails with EINVAL on 4-channel arrays, so keep the
# count explicit. Live mixer 'DMIC Volume' boots at 0 (digital
# silence); EnableSequence raises it to the ALSA max of that raw
# integer control.
#
# Live-tested on Acer Swift SF514-52T.

SectionDevice."Mic" {
	Comment "Internal Digital Microphone"

	If.vol {
		Condition {
			Type ControlExists
			Control "name='DMIC Volume'"
		}
		True.EnableSequence [
			cset "name='DMIC Volume' 100%"
		]
	}

	Value {
		CapturePCM "hw:${CardId},0"
		CaptureChannels 2
		CaptureRate 48000
		CaptureMixerElem "DMIC"
	}
}
