# HDA HDMI devices

Include.hdmi.File "/codecs/hda/hdmi.conf"

Include.hdmi-pcm.File "/common/pcm/hdmi.conf"

Define.Iec61937Pcms "3,7,8,9,10,11"

If.hdmi1 {
	Condition { Type AlwaysTrue }
	True.Macro.hdmi1.HDMI {
		Number 1
		Device 3
		Iec61937Devices "${var:Iec61937Pcms}"
		Priority 1100
	}
}

If.hdmi2 {
	Condition { Type AlwaysTrue }
	True.Macro.hdmi2.HDMI {
		Number 2
		Device 7
		Iec61937Devices "${var:Iec61937Pcms}"
		Priority 1200
	}
}

If.hdmi3 {
	Condition { Type AlwaysTrue }
	True.Macro.hdmi3.HDMI {
		Number 3
		Device 8
		Iec61937Devices "${var:Iec61937Pcms}"
		Priority 1300
	}
}

If.hdmi4 {
	Condition { Type AlwaysTrue }
	True.Macro.hdmi4.HDMI {
		Number 4
		Device 9
		Iec61937Devices "${var:Iec61937Pcms}"
		Priority 1400
	}
}

If.hdmi5 {
	Condition { Type AlwaysTrue }
	True.Macro.hdmi5.HDMI {
		Number 5
		Device 10
		Iec61937Devices "${var:Iec61937Pcms}"
		Priority 1500
	}
}

If.hdmi6 {
	Condition { Type AlwaysTrue }
	True.Macro.hdmi5.HDMI {
		Number 6
		Device 11
		Iec61937Devices "${var:Iec61937Pcms}"
		Priority 1600
	}
}
