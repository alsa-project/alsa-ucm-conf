Syntax 4

# PineNote (rk817 codec on fe410000.i2s-rk817-hifi + PDM microphone array on
# fe440000.pdm-dmic-hifi). The card is an ASoC "simple-card"; the kernel
# reports CardDriver=simple-card and CardLongName=PineNote
# (see /proc/asound/cards -- " 0 [PineNote ]: simple-card - PineNote").

SectionUseCase."HiFi" {
	File "/Rockchip/PineNote/HiFi.conf"
	Comment "Play HiFi quality music; record from the rk817 mic input or the 4-channel PDM microphone array"
}
