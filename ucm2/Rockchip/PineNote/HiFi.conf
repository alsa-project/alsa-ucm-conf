# HiFi verb for the PineNote (Pine64) sound card.
#
# Hardware, from `arecord -l` and `arecord --dump-hw-params`:
#   hw:PineNote,0  fe410000.i2s-rk817-hifi   rk817 codec: 2ch playback + capture (its own mic input)
#   hw:PineNote,1  fe440000.pdm-dmic-hifi    PDM microphone array: 2-6ch capture, 4 channels wired and live
#
# Mixer controls, from `amixer -c0 contents` (unchanged from the near-identical
# Rockchip/rk817-sound profile this file borrows its Speaker/Mic sections from):
#   'Master Playback Volume', 'Master Capture Volume', 'Mic Capture Gain',
#   'Playback Mux' (HP/SPK), 'Internal Speakers Switch'
# The PDM device has no mixer controls of its own -- gain/routing for it is
# fixed in hardware, so its SectionDevice below sets no *MixerElem.
#
# There is deliberately no "Headphones" device, unlike the rk817-sound profile
# this borrows from. The PineNote has no 3.5mm jack: the codec's HPOL/HPOR go to
# a USB-C audio/USB switch, and the device tree declares the widget for them
# (arch/arm64/boot/dts/rockchip/rk3566-pinenote.dtsi: widgets "Headphone",
# "Headphones"; routing "Headphones" -> HPOL/HPOR). But the same file's
# usb-c-connector node carries only a USB2 HS endpoint -- no audio mode, no
# mode-switch or mux binding -- so nothing in the kernel can put the connector
# into analogue audio mode, and there is no jack detection anywhere in the tree
# for a JackControl to name. A Headphones device here would be selectable,
# silent, and ungated. If the connector ever gains an audio-mode binding, it
# becomes worth adding.
#
# The If.1 block below is borrowed verbatim and the device tree explains why it
# is right for this board: HPOL/HPOR feed the Speaker Amp inputs, and the amp's
# outputs feed "Internal Speakers", which pin-switches turns into the
# 'Internal Speakers Switch' control. So the mux must sit on HP for the speakers
# to make any sound -- the branch that looks inverted is the correct one here.

Define.pbk_mux "SPK"

If.1 {
	Condition {
		Type ControlExists
		Control "name='Internal Speakers Switch'"
	}

	True {
		Define.pbk_mux "HP"
		SectionDevice."Speaker".EnableSequence [
			cset "name='Internal Speakers Switch' on"
		]

		SectionDevice."Speaker".DisableSequence [
			cset "name='Internal Speakers Switch' off"
		]
	}
}

SectionDevice."Speaker" {
	Comment "Internal speaker (rk817 codec playback, hw:PineNote,0)"

	EnableSequence [
		cset "name='Playback Mux' ${var:pbk_mux}"
	]

	Value {
		PlaybackMixerElem "Master Playback Volume"
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId}"
	}
}

SectionDevice."Mic1" {
	Comment "Built-in microphone (rk817 codec capture input, hw:PineNote,0)"

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId}"
		CaptureMixerElem "Mic Capture Gain"
		CaptureMasterElem "Master Capture Volume"
	}
}

SectionDevice."Mic2" {
	Comment "4-channel PDM microphone array above the screen (hw:PineNote,1)"

	Value {
		CapturePriority 200
		CapturePCM "hw:${CardId},1"
		CaptureChannels 4
	}
}
