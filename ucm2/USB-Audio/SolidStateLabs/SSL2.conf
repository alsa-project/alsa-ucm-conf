Comment "Solid State Labs SSL 2"

Define.DirectPlaybackChannels 2
Define.DirectCaptureChannels 4

If.plus {
	Condition {
		Type RegexMatch
		String "${CardComponents}"
		# 0002 MK I
		# 0009 MK II
		Regex "USB31e9:000[29]"
	}
	True.Define.DirectPlaybackChannels 4
}

If.fw {
	Condition {
		Type RegexMatch
		String "${sys-card:device/../bcdDevice}"
		Regex "00.."
	}
	True.Define.DirectCaptureChannels 2
}

# The "SSL 2+ Mk II" shares the same USB product ID (31e9:0009) as the
# plain "SSL 2 Mk II", but has more physical I/O (6 playback / 8 capture
# channels vs 4/4), which the USB descriptors above cannot distinguish.
# Disambiguate using the USB product string instead, which does carry
# the "+". (Only verified against "SSL 2+ Mk II" hardware; not assumed
# to also apply to the non-Mk-II "SSL 2+".)
If.ssl2plusmk2 {
	Condition {
		Type RegexMatch
		String "${sys-card:device/../product}"
		Regex "SSL 2\\+ Mk II"
	}
	True {
		Define {
			DirectPlaybackChannels 6
			DirectCaptureChannels 8
		}
	}
}

SectionUseCase."HiFi" {
	Comment "HiFi"
	File "/USB-Audio/SolidStateLabs/SSL2-HiFi.conf"
}

Include.dhw.File "/common/directm.conf"

Macro.0.DirectUseCase { Id="Direct" PlaybackChannels="${var:DirectPlaybackChannels}" CaptureChannels="${var:DirectCaptureChannels}" }
