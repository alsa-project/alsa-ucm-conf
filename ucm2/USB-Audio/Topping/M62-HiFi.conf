				Type ControlExists
				Control "name='Mic1 Analog Capture Volume'"
			}
			# the preamp BEFORE the converter; the trim in the
			# other branch is digital and buys no signal-to-noise
			True.CaptureMixerElem "Mic1 Analog"
			False.CaptureMixerElem "Mic1 Trim"
		}
	}
	Macro.pcm_split.SplitPCMDevice {
		Name "m62_mono_in"
		Direction Capture
		HWChannels 16
		Channels 1
		Channel0 0
		ChannelPos0 MONO
