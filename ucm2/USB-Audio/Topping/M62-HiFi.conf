# Bluetooth and the mobile (OTG) input. The card names these channels
# itself -- its USB string descriptors read Analogue 1/2, AUX 1/2,
# BT 1/2, Mobile 1/2 and Loopback 1..8, and macOS shows exactly those
# because Core Audio reads iChannelNames from the Input Terminal
# descriptor. Both pairs carry audio, alongside the analogue inputs and
# at the same time as them.
SectionDevice."Bluetooth" {
	Comment "BT"

	Value {
		CapturePriority 100
		CaptureMixer "default:${CardId}"
		If.analogue {
			Condition {
				Type ControlExists
				Control "name='Bluetooth Capture Volume'"
			}
			# the preamp BEFORE the converter; the trim in the
			# other branch is digital and buys no signal-to-noise
			True.CaptureMixerElem "Bluetooth"
			False.CaptureMixerElem "BT Trim"
		}
	}
	Macro.pcm_split.SplitPCMDevice {
		Name "m62_stereo_in"
		Direction Capture
		HWChannels 16
		Channels 2
		Channel0 4
		Channel1 5
		ChannelPos0 FL
		ChannelPos1 FR
	}
}

