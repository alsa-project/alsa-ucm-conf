Include.pcm_split.File "/common/pcm/split.conf"

Macro [
	{
		SplitPCM {
			Name "e2x2_stereo_out"
			Direction Playback
			Channels 2
			HWChannels 6
			HWChannelPos0 FL
			HWChannelPos1 FR
		}
	}
	{
		SplitPCM {
			Name "e2x2_mono_in"
			Direction Capture
			Channels 1
			HWChannels 6
			HWChannelPos0 MONO
			HWChannelPos1 MONO
		}
	}
	{
		SplitPCM {
			Name "e2x2_stereo_in"
			Direction Capture
			Channels 2
			HWChannels 6
			HWChannelPos0 FL
			HWChannelPos1 FR
		}
	}
]

SectionVerb {
	EnableSequence [
		cset "name='E2x2 Playback Volume' 100%,100%,0%,0%,0%,0%"
		cset "name='Mic Capture Volume' 100%,100%,0%,0%,0%,0%"

		cset "name='E2x2 Playback Switch' on,on,off,off,off,off"
		cset "name='Mic Capture Switch' on,on,off,off,off,off"

		cset "name='E2x2 Playback Volume',index=1 100%"
		cset "name='Mic Capture Volume',index=1 100%"

		cset "name='E2x2 Playback Switch',index=1 on"
		cset "name='Mic Capture Switch',index=1 on"
	]
}

SectionDevice."Line1" {
	Comment "Headphone / Monitor Out"
	
	Value {
		PlaybackPriority 200
	}

	Macro.pcm_split.SplitPCMDevice {
		Name "e2x2_stereo_out"
		Direction Playback
		HWChannels 6
		Channels 2
		Channel0 0
		Channel1 1
		ChannelPos0 FL
		ChannelPos1 FR
	}
}

SectionDevice."Mic1" {
	Comment "Mic / Line / Inst In 1L"

	Value {
		CapturePriority 200
	}

	Macro.pcm_split.SplitPCMDevice {
		Name "e2x2_mono_in"
		Direction Capture
		HWChannels 6
		Channels 1
		Channel0 0
		ChannelPos0 MONO
	}
}

SectionDevice."Mic2" {
	Comment "Mic / Line / Inst In 2R"

	Value {
		CapturePriority 150
	}

	Macro.pcm_split.SplitPCMDevice {
		Name "e2x2_mono_in"
		Direction Capture
		HWChannels 6
		Channels 1
		Channel0 1
		ChannelPos0 MONO
	}
}

SectionDevice."Mic3" {
	Comment "Mic / Line / Inst In 1L + 2R"

	ConflictingDevice [
		"Mic1"
		"Mic2"
	]

	Value {
		CapturePriority 100
	}

	Macro.pcm_split.SplitPCMDevice {
		Name "e2x2_stereo_in"
		Direction Capture
		HWChannels 6
		Channels 2
		Channel0 0
		Channel1 1
		ChannelPos0 FL
		ChannelPos1 FR
	}
}
