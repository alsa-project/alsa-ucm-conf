# Topping M62 (USB 152a:875c), Mobile Mode.
#
# In Mobile Mode (bcdDevice 01xx) the card is a two-in, two-out device.
# Its capture is NOT two inputs: it is the stereo output of one mixer
# over all of the card's inputs, which the vendor's control application
# calls Recording. A microphone on IN 1, a phone on Bluetooth and a
# source on AUX are all in it at once, though the capture terminal names
# its channels "Analogue 1" and "Analogue 2", and the application has no
# selector for what an output carries. The host's own playback is not in
# the Recording: it reaches the headphones, mixed there with the inputs.
#
# So the profile offers one playback device and one stereo capture
# device, named after the card's own Playback 1/2 and Recording.
#
# Both devices take their volume the way M62-HiFi.conf does. Where the
# kernel publishes the card's own stage -- the analogue headphone stage
# for playback, the Recording fader for capture -- the device takes it
# and the verb pins the USB trim on that side open, since the two are in
# series and a fader over their product describes neither; where it does
# not, the device takes the trim. The headphone stage sets everything in
# the headphones, the inputs heard there included. The application's
# Playback 1/2 knob, which sets the playback alone within that mix, is a
# third stage in series; where the kernel publishes it as PCM Playback,
# the verb pins it the same way, at 0 dB and on, so that the headphone
# stage is the playback's volume.
#
# The descriptor declares no channel positions, and the kernel's FL FR
# guess is right for two channels.

SectionVerb {
	If.playback_trim {
		Condition {
			Type ControlExists
			Control "name='Headphone Playback Volume'"
		}
		True.EnableSequence [
			cset "name='M62 Playback Volume' 127"
			cset "name='M62 Playback Volume',index=1 127"
			cset "name='M62 Playback Switch' on"
			cset "name='M62 Playback Switch',index=1 on"
		]
	}
	If.playback_knob {
		Condition {
			Type ControlExists
			Control "name='PCM Playback Volume'"
		}
		True.EnableSequence [
			cset "name='PCM Playback Volume' 0"
			cset "name='PCM Playback Switch' on"
		]
	}
	If.capture_trim {
		Condition {
			Type ControlExists
			Control "name='Recording Capture Volume'"
		}
		True.EnableSequence [
			cset "name='Mic Capture Volume' 127"
			cset "name='Mic Capture Volume',index=1 127"
			cset "name='Mic Capture Switch' on"
			cset "name='Mic Capture Switch',index=1 on"
		]
	}
}

SectionDevice."Line1" {
	Comment "Playback 1/2"

	Value {
		PlaybackPriority 500
		PlaybackPCM "hw:${CardId}"
		If.analogue {
			Condition {
				Type ControlExists
				Control "name='Headphone Playback Volume'"
			}
			True.PlaybackMixerElem "Headphone"
			False.PlaybackMixerElem "M62"
		}
	}
}

SectionDevice."Mic" {
	Comment "Recording"

	Value {
		CapturePriority 300
		CapturePCM "hw:${CardId}"
		If.recording {
			Condition {
				Type ControlExists
				Control "name='Recording Capture Volume'"
			}
			True.CaptureMixerElem "Recording"
			False.CaptureMixerElem "Mic"
		}
	}
}
