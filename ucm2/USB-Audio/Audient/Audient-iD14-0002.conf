Comment "Audient iD14 USB-Audio"

# The iD14 firmware applies FU12 attenuation to the right channel of each
# stereo pair but ignores the matching left-channel write.  Linux kernels with
# the upstream mixer-map quirk call this control "Monitor Mix Playback Volume";
# older kernels call it "Speaker Playback Volume".  Keep all four gains at
# unity under either name.  This also restores a balanced state left by an
# unquirked PipeWire session.
Define.MonitorMixVolume "Speaker Playback Volume"

If.renamed-monitor-mix-volume {
	Condition {
		Type ControlExists
		Control "name='Monitor Mix Playback Volume'"
	}
	True.Define.MonitorMixVolume "Monitor Mix Playback Volume"
}

FixedBootSequence [
	cset "name='${var:MonitorMixVolume}' 127,127,127,127"
]

SectionUseCase."HiFi" {
	Comment "Default"
	File "/USB-Audio/Audient/Audient-iD14-HiFi-0002.conf"
}

Include.dhw.File "/common/directm.conf"

Macro.0.DirectUseCase { Id="Direct" PlaybackChannels=4 CaptureChannels=10 }
