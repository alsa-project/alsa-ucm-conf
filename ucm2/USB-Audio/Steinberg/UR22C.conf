Comment "Steinberg UR22C USB-Audio"

Define.DirectPlaybackChannels 2
Define.DirectCaptureChannels 4

SectionUseCase."HiFi" {
	Comment "HiFi"
	File "/USB-Audio/Steinberg/UR22C-HiFi.conf"
}

Include.dhw.File "/common/directm.conf"

# Macros are evaluated before If blocks: define the Direct use case inside the condition,
# so that it gets the firmware-dependent channel count too
If.fw {
	Condition {
		Type RegexMatch
		String "${sys-card:device/../bcdDevice}"
		Regex "0[12].."
	}
	True {
		Define.DirectCaptureChannels 2
		Macro.0.DirectUseCase { Id="Direct" PlaybackChannels="${var:DirectPlaybackChannels}" CaptureChannels="${var:DirectCaptureChannels}" }
	}
	False.Macro.0.DirectUseCase { Id="Direct" PlaybackChannels="${var:DirectPlaybackChannels}" CaptureChannels="${var:DirectCaptureChannels}" }
}
