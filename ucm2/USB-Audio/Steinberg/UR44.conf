Comment "Steinberg UR44 USB-Audio"

# Class Compliant mode: DAW 1/2 (Mix 1) and DAW 3/4 (Mix 2). With its [CC MODE] switch off the device has another
# USB id (0499:150e) and two more playback channels: the FX Bus, a stereo input of the REV-X reverb.
Define.DirectPlaybackChannels 4
Define.DirectCaptureChannels 6

SectionUseCase."HiFi" {
	Comment "Default"
	File "/USB-Audio/Steinberg/UR44-HiFi.conf"
}

Include.dhw.File "/common/directm.conf"

# Macros are evaluated before If blocks, so the Direct use case is defined inside the condition
If.fxbus {
	Condition {
		Type RegexMatch
		String "${CardComponents}"
		Regex "USB0499:150e"
	}
	True {
		Define.DirectPlaybackChannels 6
		Macro.0.DirectUseCase { Id="Direct" PlaybackChannels=6 CaptureChannels=6 }
	}
	False.Macro.0.DirectUseCase { Id="Direct" PlaybackChannels=4 CaptureChannels=6 }
}
