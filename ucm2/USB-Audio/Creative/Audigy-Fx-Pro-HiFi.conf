#
# Creative Sound Blaster Audigy Fx Pro (041e:32b7)
#
# Physical topology:
#   Playback hw:X,0: Rear combo Headphones / Speakers (Front L/R + 5.1/7.1)
#                    Devices: "Headphones1" (Rear Headphones), "Speaker" (Rear Speakers)
#                    Mixer: "Speaker", Jack: "Speaker - Output Jack"
#   Playback hw:X,1: Internal Front Panel HD Audio Headphone header on the card
#                    Device: "Headphones2" (Front Panel Headphones)
#                    Mixer: "Headphone", Jack: "Headphone - Output Jack"
#   Playback hw:X,2: Rear Optical S/PDIF Output
#                    Device: "SPDIF", Switch: "PCM Playback Switch"
#   Capture  hw:X,0: Internal Front Panel HD Audio Mic header on the card
#                    Device: "Mic2" (Front Panel Microphone)
#                    Mixer: "Mic", Jack: "Mic - Input Jack"
#   Capture  hw:X,1: Rear combo Mic / Line-In jack
#                    Devices: "Mic1" (Rear Microphone), "Line" (Rear Line Input)
#                    Mixer: "Line", Jack: "Line - Input Jack"
#
# When the kernel exposes "Rear Output Mode" and "Rear Input Mode" (via
# sound/usb/mixer_quirks.c), the rear combo jacks are exposed as mutually
# exclusive Speakers/Headphones and Mic/Line-In devices that automatically
# retask the hardware jack on selection.
#

SectionVerb {
	EnableSequence [
		disdevall ""
	]

	Value.TQ "HiFi"
}

SectionDevice."Speaker" {
	Comment "Rear Speakers"

	If.rear_out_mode {
		Condition {
			Type ControlExists
			Control "name='Rear Output Mode'"
		}
		True {
			Variant."HiFi".ConflictingDevice [
				"Headphones1"
			]

			EnableSequence [
				cset "name='Rear Output Mode' Speakers"
				cset "name='Speaker Playback Switch' on"
			]
		}
		False.EnableSequence [
			cset "name='Speaker Playback Switch' on"
		]
	}

	DisableSequence [
		cset "name='Speaker Playback Switch' off"
	]

	Value {
		PlaybackChannels 2
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},0"
		JackControl "Speaker - Output Jack"
		PlaybackMixerElem "Speaker"
	}

	Variant."HiFi 5+1".Value.PlaybackChannels 6
	Variant."HiFi 7+1".Value.PlaybackChannels 8
}

If.rear_hp {
	Condition {
		Type ControlExists
		Control "name='Rear Output Mode'"
	}
	True.Variant."HiFi".SectionDevice."Headphones1" {
		Comment "Rear Headphones"

		ConflictingDevice [
			"Speaker"
		]

		EnableSequence [
			cset "name='Rear Output Mode' Headphones"
			cset "name='Speaker Playback Switch' on"
		]

		DisableSequence [
			cset "name='Speaker Playback Switch' off"
		]

		Value {
			PlaybackChannels 2
			PlaybackPriority 250
			PlaybackPCM "hw:${CardId},0"
			JackControl "Speaker - Output Jack"
			PlaybackMixerElem "Speaker"
		}
	}
}

SectionDevice."Headphones2" {
	Comment "Front Panel Headphones"

	EnableSequence [
		cset "name='Headphone Playback Switch' on"
	]

	DisableSequence [
		cset "name='Headphone Playback Switch' off"
	]

	Value {
		PlaybackPriority 300
		PlaybackPCM "hw:${CardId},1"
		JackControl "Headphone - Output Jack"
		PlaybackMixerElem "Headphone"
	}
}

SectionDevice."SPDIF" {
	Comment "S/PDIF Output"

	EnableSequence [
		cset "name='PCM Playback Switch' on"
	]

	DisableSequence [
		cset "name='PCM Playback Switch' off"
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},2"
		PlaybackSwitch "PCM Playback Switch"
	}
}

SectionDevice."Line" {
	Comment "Rear Line Input"

	If.rear_in_mode {
		Condition {
			Type ControlExists
			Control "name='Rear Input Mode'"
		}
		True {
			ConflictingDevice [
				"Mic1"
			]

			EnableSequence [
				cset "name='Rear Input Mode' Line-In"
				cset "name='Line Capture Switch' on"
			]
		}
		False.EnableSequence [
			cset "name='Line Capture Switch' on"
		]
	}

	If.line_boost_zero {
		Condition {
			Type ControlExists
			Control "name='Rear Mic Boost Volume'"
		}
		True.Append.EnableSequence [
			cset "name='Rear Mic Boost Volume' 0"
		]
	}

	DisableSequence [
		cset "name='Line Capture Switch' off"
	]

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},1"
		JackControl "Line - Input Jack"
		CaptureMixerElem "Line"
	}
}

If.rear_mic {
	Condition {
		Type ControlExists
		Control "name='Rear Input Mode'"
	}
	True.SectionDevice."Mic1" {
		Comment "Rear Microphone"

		ConflictingDevice [
			"Line"
		]

		EnableSequence [
			cset "name='Rear Input Mode' Mic"
			cset "name='Line Capture Switch' on"
		]

		DisableSequence [
			cset "name='Line Capture Switch' off"
		]

		Value {
			CapturePriority 300
			CapturePCM "hw:${CardId},1"
			JackControl "Line - Input Jack"
			CaptureMixerElem "Line"

			If.mic_boost {
				Condition {
					Type ControlExists
					Control "name='Rear Mic Boost Volume'"
				}
				True.CaptureMasterElem "Rear Mic Boost"
			}
		}
	}
}

SectionDevice."Mic2" {
	Comment "Front Panel Microphone"

	EnableSequence [
		cset "name='Mic Capture Switch' on"
	]

	DisableSequence [
		cset "name='Mic Capture Switch' off"
	]

	Value {
		CapturePriority 400
		CapturePCM "hw:${CardId},0"
		JackControl "Mic - Input Jack"
		CaptureMixerElem "Mic"
	}
}
