Include.pcm_split.File "/common/pcm/split.conf"

If.playback12 {
	Condition {
		Type String
		String1 "${var:PlaybackChannels}"
		String2 "12"
	}
	True {
		Macro [
			{
				SplitPCM {
					Name "tx6_stereo_out"
					Direction Playback
					Channels 2
					HWChannels 12
					HWChannelPos0 FL
					HWChannelPos1 FR
					HWChannelPos2 FL
					HWChannelPos3 FR
					HWChannelPos4 FL
					HWChannelPos5 FR
					HWChannelPos6 FL
					HWChannelPos7 FR
					HWChannelPos8 FL
					HWChannelPos9 FR
					HWChannelPos10 FL
					HWChannelPos11 FR
				}
			}
		]

		SectionDevice."Line1" {
			Comment "Channel 1"

			Value {
				PlaybackPriority 600
			}
			Macro.pcm_split.SplitPCMDevice {
				Name "tx6_stereo_out"
				Direction Playback
				HWChannels 12
				Channels 2
				Channel0 0
				Channel1 1
				ChannelPos0 FL
				ChannelPos1 FR
			}
		}

		SectionDevice."Line2" {
			Comment "Channel 2"

			Value {
				PlaybackPriority 500
			}
			Macro.pcm_split.SplitPCMDevice {
				Name "tx6_stereo_out"
				Direction Playback
				HWChannels 12
				Channels 2
				Channel0 2
				Channel1 3
				ChannelPos0 FL
				ChannelPos1 FR
			}
		}

		SectionDevice."Line3" {
			Comment "Channel 3"

			Value {
				PlaybackPriority 400
			}
			Macro.pcm_split.SplitPCMDevice {
				Name "tx6_stereo_out"
				Direction Playback
				HWChannels 12
				Channels 2
				Channel0 4
				Channel1 5
				ChannelPos0 FL
				ChannelPos1 FR
			}
		}

		SectionDevice."Line4" {
			Comment "Channel 4"

			Value {
				PlaybackPriority 300
			}
			Macro.pcm_split.SplitPCMDevice {
				Name "tx6_stereo_out"
				Direction Playback
				HWChannels 12
				Channels 2
				Channel0 6
				Channel1 7
				ChannelPos0 FL
				ChannelPos1 FR
			}
		}

		SectionDevice."Line5" {
			Comment "Channel 5"

			Value {
				PlaybackPriority 200
			}
			Macro.pcm_split.SplitPCMDevice {
				Name "tx6_stereo_out"
				Direction Playback
				HWChannels 12
				Channels 2
				Channel0 8
				Channel1 9
				ChannelPos0 FL
				ChannelPos1 FR
			}
		}

		SectionDevice."Line6" {
			Comment "Channel 6"

			Value {
				PlaybackPriority 100
			}
			Macro.pcm_split.SplitPCMDevice {
				Name "tx6_stereo_out"
				Direction Playback
				HWChannels 12
				Channels 2
				Channel0 10
				Channel1 11
				ChannelPos0 FL
				ChannelPos1 FR
			}
		}
	}
	False {
		SectionDevice."Line13" {
			Comment "Main"

			Value {
				PlaybackPriority 600
				PlaybackPCM "hw:${CardId}"
			}
		}
	}
}

If.capture12 {
	Condition {
		Type String
		String1 "${var:CaptureChannels}"
		String2 "12"
	}
	True {
		Macro [
			{
				SplitPCM {
					Name "tx6_stereo_in"
					Direction Capture
					Channels 2
					HWChannels 12
					HWChannelPos0 FL
					HWChannelPos1 FR
					HWChannelPos2 FL
					HWChannelPos3 FR
					HWChannelPos4 FL
					HWChannelPos5 FR
					HWChannelPos6 FL
					HWChannelPos7 FR
					HWChannelPos8 FL
					HWChannelPos9 FR
					HWChannelPos10 FL
					HWChannelPos11 FR
				}
			}
		]

		SectionDevice."Line7" {
			Comment "Channel 1 Input"

			Value {
				CapturePriority 600
			}
			Macro.pcm_split.SplitPCMDevice {
				Name "tx6_stereo_in"
				Direction Capture
				HWChannels 12
				Channels 2
				Channel0 0
				Channel1 1
				ChannelPos0 FL
				ChannelPos1 FR
