				Name "tx6_stereo_in"
				Direction Capture
				HWChannels 12
				Channels 2
				Channel0 10
				Channel1 11
				ChannelPos0 FL
				ChannelPos1 FR
			}
		}
	}
	False {
		SectionDevice."Line14" {
			Comment "Main Mix"

			Value {
				CapturePriority 600
				CapturePCM "hw:${CardId}"
			}
		}
	}
}
