Comment "Teenage Engineering TX-6"

Define {
	PlaybackChannels 2
	CaptureChannels 2
}

If.playback12 {
	Condition {
		Type String
		# bNrChannels of the USB streaming input terminal, set by the USB mode
		String1 "${sys-card:[type=hex,pos=0x36]device/../descriptors}"
		String2 "0c"
	}
	True.Define.PlaybackChannels 12
}

If.capture12 {
	Condition {
		Type String
		# bNrChannels of the mixer input terminal feeding the USB output, set by the USB mode
		String1 "${sys-card:[type=hex,pos=0x4b]device/../descriptors}"
		String2 "0c"
	}
	True.Define.CaptureChannels 12
}

SectionUseCase."HiFi" {
	Comment "Mixer channels or main mix, per USB mode"
	File "/USB-Audio/TeenageEngineering/TX-6-HiFi.conf"
}

Include.dhw.File "/common/directm.conf"

If.direct {
	Condition { Type AlwaysTrue }
	True.Macro.0.DirectUseCase { Id="Direct" CardName="TX-6" PlaybackChannels="${var:PlaybackChannels}" CaptureChannels="${var:CaptureChannels}" }
}
