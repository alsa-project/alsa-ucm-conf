Include.pcm_split.File "/common/pcm/split.conf"

Macro [
	{
		SplitPCM {
			Name "mtrack_solo_mono_in"
			Direction Capture
			Channels 1
			HWChannels 2
			HWChannelPos0 MONO
			HWChannelPos1 MONO
		}
	}
]

SectionDevice."Speaker" {
	Comment "Output"

	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
		PlaybackMixerElem "PCM"
		PlaybackVolume "PCM Playback Volume"
		PlaybackSwitch "PCM Playback Switch"
	}
}

SectionDevice."Mic1" {
	Comment "Input 1 (Mic)"

	Value {
		CapturePriority 600
	}

	Macro.pcm_split.SplitPCMDevice {
		Name "mtrack_solo_mono_in"
		Direction Capture
		HWChannels 2
		Channels 1
		Channel0 0
		ChannelPos0 MONO
	}
}

SectionDevice."Line2" {
	Comment "Input 2 (Line)"

	Value {
		CapturePriority 500
	}

	Macro.pcm_split.SplitPCMDevice {
		Name "mtrack_solo_mono_in"
		Direction Capture
		HWChannels 2
		Channels 1
		Channel0 1
		ChannelPos0 MONO
	}
}
