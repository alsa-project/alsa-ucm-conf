# Channel mapping
#
# +----+---------------+-----------------+
# | Ch |     Inputs    |      Outputs    |
# +====+===============+=================+
# |  0 |   Line/XLR 1  |      Line 1     |
# |    |               | (Speaker Out L) |
# +----+---------------+-----------------+
# |  1 |   Line/XLR 2  |      Line 2     |
# |    |               | (Speaker Out R) |
# +----+---------------+-----------------+
# |  2 |     Line 3    |      Line 3     |
# +----+---------------+-----------------+
# |  3 |     Line 4    |      Line 4     |
# +----+---------------+-----------------+
# |  4 |     Line 5    |      Line 5     |
# +----+---------------+-----------------+
# |  5 |     Line 6    |      Line 6     |
# +----+---------------+-----------------+
# |  6 |     Line 7    |      Line 7     |
# |    |               | (Mirrored for   |
# |    |               |  Headphone 1 L) |
# +----+---------------+-----------------+
# |  7 |     Line 8    |      Line 8     |
# |    |               | (Mirrored for   |
# |    |               |  Headphone 1 R) |
# +----+---------------+-----------------+
# |  8 |               |      Line 9     |
# |    |               |  (Mirrored for  |
# |    |               |  Headphone 2 L) |
# +----+---------------+-----------------+
# |  9 |               |     Line 10     |
# |    |               | (Mirrored for   |
# |    |               |  Headphone 2 R) |
# +----+---------------+-----------------+
# | 10 |   S/PDIF 1    |     S/PDIF 1    |
# +----+---------------+-----------------+
# | 11 |   S/PDIF 2    |     S/PDIF 2    |
# +----+---------------+-----------------+
# | 12 |   ADAT 1.1    |     ADAT 1.1    |
# +----+---------------+-----------------+
# | 13 |   ADAT 1.2    |     ADAT 1.2    |
# +----+---------------+-----------------+
# | 14 |   ADAT 1.3    |     ADAT 1.3    |
# +----+---------------+-----------------+
# | 15 |   ADAT 1.4    |     ADAT 1.4    |
# +----+---------------+-----------------+
# | 16 |   ADAT 1.5    |     ADAT 1.5    |
# +----+---------------+-----------------+
# | 17 |   ADAT 1.6    |     ADAT 1.6    |
# +----+---------------+-----------------+
# | 18 |   ADAT 1.7    |     ADAT 1.7    |
# +----+---------------+-----------------+
# | 19 |   ADAT 1.8    |     ADAT 1.8    |
# +----+---------------+-----------------+
#

Define.Generation "1st"
Define.DirectPlaybackChannels 20
Define.DirectCaptureChannels 20  # fallback; overridden per generation

# Digital (S/PDIF + ADAT) capture-input channel indices.
# Default = 20-channel (3rd/4th gen) layout. The 18-channel 1st/2nd gen
# capture stream omits the two extra channels at 8-9, so its S/PDIF and
# ADAT inputs sit two channels lower (overridden in the gen1/gen2 blocks).
Define.SpdifInCh0 10
Define.SpdifInCh1 11
Define.AdatInCh0 12
Define.AdatInCh1 13
Define.AdatInCh2 14
Define.AdatInCh3 15
Define.AdatInCh4 16
Define.AdatInCh5 17
Define.AdatInCh6 18
Define.AdatInCh7 19

If.gen1 {
	Condition {
		Type RegexMatch
		String "${CardComponents}"
		Regex "USB1235:800c"
	}
	True.Define {
		DirectCaptureChannels 18
		# 18-ch capture: S/PDIF in = 8,9 ; ADAT in = 10..17
		SpdifInCh0 8
		SpdifInCh1 9
		AdatInCh0 10
		AdatInCh1 11
		AdatInCh2 12
		AdatInCh3 13
		AdatInCh4 14
		AdatInCh5 15
		AdatInCh6 16
		AdatInCh7 17
	}
}

If.gen2 {
	Condition {
		Type RegexMatch
		String "${CardComponents}"
		Regex "USB1235:8201"
	}
	True.Define {
		Generation "2nd"
		DirectCaptureChannels 18
		# 18-ch capture: S/PDIF in = 8,9 ; ADAT in = 10..17
		SpdifInCh0 8
		SpdifInCh1 9
		AdatInCh0 10
		AdatInCh1 11
		AdatInCh2 12
		AdatInCh3 13
		AdatInCh4 14
		AdatInCh5 15
		AdatInCh6 16
		AdatInCh7 17
	}
}

If.gen3 {
	Condition {
		Type RegexMatch
		String "${CardComponents}"
		Regex "USB1235:8215"
	}
	True.Define {
		Generation "3rd"
		DirectCaptureChannels 20
	}
}

If.gen4 {
	Condition {
		Type RegexMatch
		String "${CardComponents}"
		Regex "USB1235:821d"
	}
	True {
		Define {
			Generation "4th"
			DirectPlaybackChannels 26
			DirectCaptureChannels 26
			bcdDevice "${sys-card:device/../bcdDevice}"
		}
		If.fwp {
			# bcdNumbers 0900-097a
			Condition {
				Type RegexMatch
				String "${var:bcdDevice}"
				Regex "(09[0-6].|097[0-9a])"
			}
			True.Define.DirectPlaybackChannels 24
		}
		If.fwc {
			# bcdNumbers 0000-08ff, 0900-097a
			Condition {
				Type RegexMatch
				String "${var:bcdDevice}"
				Regex "(0[0-8]..|09[0-6].|097[0-9a])"
			}
			True.Define.DirectCaptureChannels 20
		}
	}
}

Comment "Focusrite Scarlett 18i20 ${var:Generation} Gen"

SectionUseCase."HiFi" {
	Comment "HiFi"
	File "/USB-Audio/Focusrite/Scarlett-18i20-HiFi.conf"
}

Include.dhw.File "/common/directm.conf"

Macro.0.DirectUseCase {
	Id="Direct 48kHz"
	PlaybackChannels="${var:DirectPlaybackChannels}"
	PlaybackRate=48000
	CaptureChannels="${var:DirectCaptureChannels}"
	CaptureRate=48000
}
