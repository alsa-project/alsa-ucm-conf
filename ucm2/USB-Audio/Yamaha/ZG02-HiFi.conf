# Yamaha ZG02 game streaming mixer
#
# Playback (10ch): 0-1 feed the voice chat bus, 2-9 feed the game bus
# (7.1); each bus follows its own level knob on the mixer.
# Capture (4ch): 0-1 streaming mix, 2-3 microphone.

Include.pcm_split.File "/common/pcm/split.conf"

Macro [
	{
		SplitPCM {
			Name "zg02_stereo_out"
			Direction Playback
			Format S32_LE
			Channels 2
			HWChannels 10
			HWChannelPos0 FL
			HWChannelPos1 FR
			HWChannelPos2 FL
			HWChannelPos3 FR
			HWChannelPos4 FC
			HWChannelPos5 LFE
			HWChannelPos6 RL
			HWChannelPos7 RR
			HWChannelPos8 SL
			HWChannelPos9 SR
		}
	}
	{
		SplitPCM {
			Name "zg02_surround_out"
			Direction Playback
			Format S32_LE
			Channels 8
			HWChannels 10
			HWChannelPos0 FL
			HWChannelPos1 FR
			HWChannelPos2 FL
			HWChannelPos3 FR
			HWChannelPos4 FC
			HWChannelPos5 LFE
			HWChannelPos6 RL
			HWChannelPos7 RR
			HWChannelPos8 SL
			HWChannelPos9 SR
		}
	}
	{
		SplitPCM {
			Name "zg02_stereo_in"
			Direction Capture
			Format S32_LE
			Channels 2
			HWChannels 4
			HWChannelPos0 FL
			HWChannelPos1 FR
			HWChannelPos2 FL
			HWChannelPos3 FR
		}
	}
]

SectionDevice."Line1" {
	Comment "Game"

	Value {
		PlaybackPriority 200
	}
	Macro.pcm_split.SplitPCMDevice {
		Name "zg02_surround_out"
		Direction Playback
		HWChannels 10
		Channels 8
		Channel0 2
		Channel1 3
		Channel2 4
		Channel3 5
		Channel4 6
		Channel5 7
		Channel6 8
		Channel7 9
		ChannelPos0 FL
		ChannelPos1 FR
		ChannelPos2 FC
		ChannelPos3 LFE
		ChannelPos4 RL
		ChannelPos5 RR
		ChannelPos6 SL
		ChannelPos7 SR
	}
}

SectionDevice."Headphones" {
	Comment "Chat"

	Value {
		PlaybackPriority 100
	}
	Macro.pcm_split.SplitPCMDevice {
		Name "zg02_stereo_out"
		Direction Playback
		HWChannels 10
		Channels 2
		Channel0 0
		Channel1 1
		ChannelPos0 FL
		ChannelPos1 FR
	}
}

SectionDevice."Mic" {
	Comment "Microphone"

	Value {
		CapturePriority 200
	}
	Macro.pcm_split.SplitPCMDevice {
		Name "zg02_stereo_in"
		Direction Capture
		HWChannels 4
		Channels 2
		Channel0 2
		Channel1 3
		ChannelPos0 FL
		ChannelPos1 FR
	}
}

SectionDevice."Line2" {
	Comment "Streaming Mix"

	Value {
		CapturePriority 100
	}
	Macro.pcm_split.SplitPCMDevice {
		Name "zg02_stereo_in"
		Direction Capture
		HWChannels 4
		Channels 2
		Channel0 0
		Channel1 1
		ChannelPos0 FL
		ChannelPos1 FR
	}
}
