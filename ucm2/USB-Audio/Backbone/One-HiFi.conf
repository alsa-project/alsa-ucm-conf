SectionDevice."Headphones" {
	Comment "Backbone headphones"
	EnableSequence [
		cset "name='PCM Playback Switch' on"
	]
	DisableSequence [
		cset "name='PCM Playback Switch' off"
	]
	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
		JackControl "Headset - Output Jack"
		# Hardware volume changes had no audible effect in playback tests.
		# Omit hardware volume controls so the session manager scales PCM.
	}
}

SectionDevice."Headset" {
	Comment "Backbone headset microphone"
	Value {
		CapturePriority 200
		CapturePCM "hw:${CardId},0"
		CaptureChannels 1
		JackControl "Headset - Input Jack"
	}
}
