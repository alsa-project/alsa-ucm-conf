# The RODECaster Duo has two USB ports.
# USB1 supports multitrack capture and playback. The PID of USB1 changes depending on the device configuration.
# USB2 acts as a simple stereo device and has its own PID.
# The configuration below supports devices running on firmware 1.7.3+.

Comment "RODECaster Duo USB"
If.usb1 {
	Condition {
		Type String
		Haystack "${CardComponents}"
		Needle "USB19f7:0050"
	}
	True {
		# Multitrack disabled
		SectionUseCase."HiFi" {
			Comment "RODECaster Duo"
			Config {
				SectionDevice."Speaker" {
					Comment "System"
					Value {
						PlaybackPCM "hw:${CardId},1"
						PlaybackPriority 100
					}
				}
				SectionDevice."Line:chat" {
					Comment "Chat"
					Value {
						PlaybackPCM "hw:${CardId},0"
						PlaybackPriority 110
					}
				}
				SectionDevice."Mic" {
					Comment "Microphone"
					Value {
						CapturePCM "hw:${CardId},0"
						CapturePriority 100
					}
				}
				SectionDevice."Line:main" {
					Comment "Main"
					Value {
						CapturePCM "hw:${CardId},1"
						CapturePriority 110
					}
				}
			}
		}
	}
}
If.usb1_multitrack {
	Condition {
		Type String
		Haystack "${CardComponents}"
		Needle "USB19f7:0095"
	}
	True {
		# Multitrack Capture and Playback
		SectionUseCase."HiFi" {
			Comment "RODECaster Duo"
			Config {
				Include.playback.File "/USB-Audio/RODE/RODECaster-Duo-Multitrack-Playback.conf"
				Include.capture.File "/USB-Audio/RODE/RODECaster-Duo-Multitrack-Capture.conf"
			}
		}
	}
}
If.usb1_multitrack_playback {
	Condition {
		Type String
		Haystack "${CardComponents}"
		Needle "USB19f7:0079"
	}
	True {
		# Multitrack Playback Only
		SectionUseCase."HiFi" {
			Comment "RODECaster Duo"
			Config {
				Include.playback.File "/USB-Audio/RODE/RODECaster-Duo-Multitrack-Playback.conf"
				SectionDevice."Mic" {
					Comment "Microphone"
					Value {
						CapturePCM "hw:${CardId},0"
						CapturePriority 100
					}
				}
				SectionDevice."Line:main" {
					Comment "Main"
					Value {
						CapturePCM "hw:${CardId},1"
						CapturePriority 110
					}
				}
			}
		}
	}
}
If.usb1_multitrack_capture {
	Condition {
		Type String
		Haystack "${CardComponents}"
		Needle "USB19f7:0093"
	}
	True {
		# Multitrack Capture Only
		SectionUseCase."HiFi" {
			Comment "RODECaster Duo"
			Config {
				Include.capture.File "/USB-Audio/RODE/RODECaster-Duo-Multitrack-Capture.conf"
				SectionDevice."Speaker" {
					Comment "System"
					Value {
						PlaybackPCM "hw:${CardId},1"
						PlaybackPriority 100
					}
				}
				SectionDevice."Line:chat" {
					Comment "Chat"
					Value {
						PlaybackPCM "hw:${CardId},0"
						PlaybackPriority 110
					}
				}
			}
		}
	}
}

If.usb2 {
	Condition {
		Type String
		Haystack "${CardComponents}"
		Needle "USB19f7:004e"
	}
	True {
		SectionUseCase."HiFi" {
			Comment "RODECaster Duo"
			Config {
				SectionDevice."Speaker" {
					Comment "Secondary"

					Value {
						PlaybackPCM "hw:${CardId},0"
					}
				}
				SectionDevice."Mic" {
					Comment "Secondary"

					Value {
						CapturePCM "hw:${CardId},0"
					}
				}
			}
		}
	}
}
