# Use case Configuration for sof-soundwire card
#
# Everest Semiconductor ES9356 (SDCA) - internal DMIC (SmartMic) function.
# Internal microphone capture is PCM device 4 on AMD ACP6.3 SDCA boards.

SectionDevice."Mic" {
	Comment "Internal Microphone"

	ConflictingDevice [
		"Headset"
	]

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},4"
	}
}
