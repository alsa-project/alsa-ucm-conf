# Use case Configuration for sof-soundwire card
#
# Everest Semiconductor ES9356 (SDCA) - speaker (SmartAmp) function.
# Speaker playback is PCM device 2 on AMD ACP6.3 SDCA boards.

SectionDevice."Speaker" {
	Comment "Speaker"

	ConflictingDevice [
		"Headphones"
	]

	EnableSequence [
		cset "name='Speaker Switch' on"
	]

	DisableSequence [
		cset "name='Speaker Switch' off"
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},2"
	}
}
