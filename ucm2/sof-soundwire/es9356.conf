# Use case Configuration for sof-soundwire card
#
# Everest Semiconductor ES9356 (SDCA) - a single device providing the headset
# (UAJ), the speaker (SmartAmp) and the internal DMIC (SmartMic) functions.
#
# On AMD ACP6.3 SDCA boards the PCM layout of this codec is:
#   device 0: headset playback, device 1: headset capture,
#   device 2: speaker playback, device 4: internal DMIC capture.

If.codec_spk {
	Condition {
		Type RegexMatch
		Regex "(es9356(-spk)?)"
		String "${var:SpeakerCodec1}"
	}
	True {
		SectionDevice."Speaker" {
			Comment "Speaker"

			ConflictingDevice [
				"Headphones"
			]

			EnableSequence [
				cset "name='Speaker Switch' on"
			]

			DisableSequence [
				cset "name='Speaker Switch' off"
			]

			Value {
				PlaybackPriority 100
				PlaybackPCM "hw:${CardId},2"
			}
		}
	}
}

If.codec_hs {
	Condition {
		Type RegexMatch
		Regex "(es9356(-sdca)?)"
		String "${var:HeadsetCodec1}"
	}
	True {
		SectionDevice."Headphones" {
			Comment "Headphones"

			ConflictingDevice [
				"Speaker"
			]

			EnableSequence [
				cset "name='Headphone Switch' on"
			]

			DisableSequence [
				cset "name='Headphone Switch' off"
			]

			Value {
				PlaybackPriority 200
				PlaybackPCM "hw:${CardId}"
				JackControl "Headphone Jack"
			}
		}

		SectionDevice."Headset" {
			Comment "Headset Microphone"

			ConflictingDevice [
				"Mic"
			]

			EnableSequence [
				cset "name='Headset Mic Switch' on"
			]

			DisableSequence [
				cset "name='Headset Mic Switch' off"
			]

			Value {
				CapturePriority 200
				CapturePCM "hw:${CardId},1"
				JackControl "Headset Mic Jack"
			}
		}
	}
}

If.codec_mic {
	Condition {
		Type RegexMatch
		# guard with '=' to avoid empty or es9356-spk matching
		Regex "=(es9356(-sdca|-dmic)?)="
		String "=${var:MicCodec1}="
	}
	True {
		SectionDevice."Mic" {
			Comment "Internal Microphone"

			ConflictingDevice [
				"Headset"
			]

			Value {
				CapturePriority 100
				CapturePCM "hw:${CardId},4"
			}
		}
	}
}
