# Use case Configuration for sof-soundwire card

If.codecspk {
	Condition {
		Type RegexMatch
		Regex "rt766"
		String "${var:SpeakerCodec1}"
	}
	True {
		SectionDevice."Speaker" {
			Comment "Speaker"

			EnableSequence [
				cset "name='Speaker Switch' on"
			]

			DisableSequence [
				cset "name='Speaker Switch' off"
			]

			Value {
				PlaybackPriority 100
				PlaybackPCM "hw:${CardId},2"
				PlaybackMixerElem "rt766 FU21"
				PlaybackSwitch "rt766 FU21 Playback Switch"
			}
		}
	}
}

SectionDevice."Headphones" {
	Comment	"Headphones"

	EnableSequence [
		cset "name='Headphone Switch' on"
	]

	DisableSequence [
		cset "name='Headphone Switch' off"
	]

	Value {
	      PlaybackPriority 200
	      PlaybackPCM "hw:${CardId}"
	      JackControl "Headphone Jack"
	}
}

SectionDevice."Headset" {
	Comment "Headset Microphone"

	EnableSequence [
		cset "name='rt766 FU36 Capture Switch' 1"
	]

	DisableSequence [
		cset "name='rt766 FU36 Capture Switch' 0"
	]

	If.hsmicsw {
		Condition {
			Type ControlExists
			Control "name='Headset Mic Switch'"
		}
		True {
			EnableSequence [
				cset "name='Headset Mic Switch' on"
			]
			DisableSequence [
				cset "name='Headset Mic Switch' off"
			]
		}
	}

	Value {
		CapturePriority 300
		CapturePCM "hw:${CardId},1"
		CaptureSwitch "rt766 FU36 Capture Switch"
		CaptureVolume "rt766 FU36 Capture Volume"
		CaptureMixerElem "rt766 FU36"
		JackControl "Headset Mic Jack"
	}
}

If.codecmic {
	Condition {
		Type RegexMatch
		Regex "rt766"
		String "${var:MicCodec1}"
	}
	True {
		SectionDevice."Mic" {
			Comment "SoundWire Microphones"

			EnableSequence [
				cset "name='rt766 FU113 Capture Switch' 1"
			]

			DisableSequence [
				cset "name='rt766 FU113 Capture Switch' 0"
			]

			Value {
				CapturePriority 100
				CapturePCM "hw:${CardId},4"
				CaptureSwitch "rt766 FU113 Capture Switch"
				CaptureVolume "rt766 FU113 Capture Volume"
				CaptureMixerElem "rt766 FU113"
			}
		}
	}
}
