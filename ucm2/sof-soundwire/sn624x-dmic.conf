# Use case Configuration for sof-soundwire card (MicCodec=sn624x-dmic)

SectionDevice."Dmic" {
	Comment "Microphone built-in"
	EnableSequence [
		cset "name='Dmic Switch' on"
	]

	DisableSequence [
		cset "name='Dmic Switch' off"
	]

	Value {
		CapturePriority 2000
		CapturePCM "hw:${CardId},4"
		CaptureMixerElem "Dmic"
	}
}
