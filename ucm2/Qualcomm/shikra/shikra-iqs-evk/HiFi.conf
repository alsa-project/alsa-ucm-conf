# Use case configuration for Qualcomm Shikra IQS EVK.
# Codec: MAX98091 analog playback and capture, VA DMIC capture
# Speaker: hw:0,0   Headphones: hw:0,0
# DMIC: hw:0,1   Headset Mic: hw:0,2
#
# The speaker and the headphone outputs share the only playback front-end,
# so they cannot be used at the same time. The jack is not detected on this
# board, hence the speaker is given the higher priority and is the one
# selected by default.

SectionVerb {
	EnableSequence [
		cset "name='AIF_MI2S_RX_0 Audio Mixer MultiMedia1' 1"
		cset "name='MultiMedia2 Mixer VA_CODEC_DMA_TX_0' 1"
		cset "name='MultiMedia3 Mixer AIF_MI2S_TX_0' 1"
	]
	Include.e.File "/codecs/max98090/EnableSeq.conf"
	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speaker playback"

	ConflictingDevice [
		"Headphones"
	]

	EnableSequence [
		cset "name='Speaker Left Switch' on"
		cset "name='Speaker Right Switch' on"
		cset "name='Speaker Switch' on"
	]

	DisableSequence [
		cset "name='Speaker Left Switch' off"
		cset "name='Speaker Right Switch' off"
		cset "name='Speaker Switch' off"
	]

	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
		PlaybackMixer "default:${CardId}"
		PlaybackMixerElem "Speaker"
	}
}

SectionDevice."Headphones" {
	Comment "Headphones playback"

	ConflictingDevice [
		"Speaker"
	]

	EnableSequence [
		cset "name='Headphone Left Switch' on"
		cset "name='Headphone Right Switch' on"
		cset "name='Headphone Switch' on"
	]

	DisableSequence [
		cset "name='Headphone Left Switch' off"
		cset "name='Headphone Right Switch' off"
		cset "name='Headphone Switch' off"
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
		PlaybackMixer "default:${CardId}"
		PlaybackMixerElem "Headphone"
	}
}

SectionDevice."Mic" {
	Comment "Internal Digital Microphone capture"

	Include.vadm0e.File "/codecs/qcom-lpass/va-macro/DMIC0EnableSeq.conf"
	Include.vadm0d.File "/codecs/qcom-lpass/va-macro/DMIC0DisableSeq.conf"
	Include.vadm1e.File "/codecs/qcom-lpass/va-macro/DMIC1EnableSeq.conf"
	Include.vadm1d.File "/codecs/qcom-lpass/va-macro/DMIC1DisableSeq.conf"

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},1"
		CaptureChannels 1
	}
}

SectionDevice."Headset" {
	Comment "Headset Microphone capture"

	EnableSequence [
		cset "name='DMIC Mux' ADC"
		cset "name='MIC2 Mux' IN34"
		cset "name='Headset Mic Switch' on"
		cset "name='Left ADC Mixer MIC2 Switch' on"
		cset "name='Right ADC Mixer MIC2 Switch' on"
		cset "name='MIC2 Boost Volume' 1"
		cset "name='Record Path DC Blocking' on"
	]

	DisableSequence [
		cset "name='Headset Mic Switch' off"
		cset "name='Left ADC Mixer MIC2 Switch' off"
		cset "name='Right ADC Mixer MIC2 Switch' off"
		cset "name='Record Path DC Blocking' off"
		cset "name='DMIC Mux' DMIC"
	]

	Value {
		CapturePriority 200
		CapturePCM "hw:${CardId},2"
		CaptureChannels 2
		CaptureMixer "default:${CardId}"
		CaptureMixerElem "MIC2"
	}
}
