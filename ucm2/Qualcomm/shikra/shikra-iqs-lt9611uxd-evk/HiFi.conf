# Use case configuration for Qualcomm Shikra IQS LT9611UXD-EVK.
# Codec: LT9611UXD HDMI bridge chip
# audio over HDMI: hw:0,0 

SectionVerb {
	EnableSequence [
		cset "name='PRIMARY_MI2S_RX Audio Mixer MultiMedia1' 1"
	]
	Value {
		TQ "HiFi"
	}
}

SectionDevice."HDMI" {
	Comment "HDMI audio playback"

	Value {
		PlaybackPCM "hw:${CardId},0"
		PlaybackMixer "default:${CardId}"
	}

	EnableSequence [
		cset "name='PRIMARY_MI2S_RX Audio Mixer MultiMedia1' 1"
	]

	DisableSequence [
		cset "name='PRIMARY_MI2S_RX Audio Mixer MultiMedia1' 0"
	]

}
