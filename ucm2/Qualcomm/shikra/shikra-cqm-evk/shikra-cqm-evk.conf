Syntax 4

SectionUseCase."HiFi" {
	File "/Qualcomm/shikra/shikra-cqm-evk/HiFi.conf"
	Comment "HiFi quality Music."
}

BootSequence [
	cset "name='RX_RX0 Digital Volume' 60"
	cset "name='RX_RX0 Mix Digital Volume' 60"
	cset "name='RX_RX1 Digital Volume' 60"
	cset "name='RX_RX1 Mix Digital Volume' 60"
	cset "name='RX_COMP1 Switch' 0"
	cset "name='RX_COMP2 Switch' 0"
	cset "name='HPHL Volume' 15"
	cset "name='HPHR Volume' 15"
	cset "name='ADC2 Volume' 20"
]

Include.card-init.File "/lib/card-init.conf"
Include.ctl-remap.File "/lib/ctl-remap.conf"
Include.wcd-init.File "/codecs/pm4125/init.conf"
