# Use case configuration for Qualcomm Shikra CQM EVK.
# Codec: WSA885x I2S speaker, PM4125 headset, VA DMIC capture
# Speaker: hw:0,2   DMIC: hw:0,3
# Headphones: hw:0,1   Headset Mic: hw:0,0

SectionVerb {
	EnableSequence [
		cset "name='Rx Slot Mask' 3"
		cset "name='Speaker Volume' 72"
		cset "name='Usage Mode' 3"
	]

	DisableSequence [
		cset "name='Speaker Volume' 0"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speaker playback"

	EnableSequence [
		cset "name='Rx Slot Mask' 3"
		cset "name='Speaker Volume' 72"
		cset "name='Usage Mode' 3"
	]

	DisableSequence [
		cset "name='Speaker Volume' 0"
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},2"
		PlaybackChannels 2
	}
}

SectionDevice."Headphones" {
	Comment "Headphones playback"

	Include.wcdhpe.File "/codecs/pm4125/HeadphoneEnableSeq.conf"
	Include.wcdhpd.File "/codecs/pm4125/HeadphoneDisableSeq.conf"
	Include.rxmhpe.File "/codecs/qcom-lpass/rx-macro/HeadphoneMixEnableSeq.conf"
	Include.rxmhpd.File "/codecs/qcom-lpass/rx-macro/HeadphoneMixDisableSeq.conf"

	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},1"
		PlaybackChannels 2
		PlaybackMixer "default:${CardId}"
		PlaybackMixerElem "HP"
		JackControl "Headphone Jack"
		JackHWMute "Speaker"
	}
}

SectionDevice."Mic" {
	Comment "Internal Digital Microphone Capture"

	ConflictingDevice [
		"Headset"
	]

	Include.vadm0e.File "/codecs/qcom-lpass/va-macro/DMIC0EnableSeq.conf"
	Include.vadm0d.File "/codecs/qcom-lpass/va-macro/DMIC0DisableSeq.conf"
	Include.vadm1e.File "/codecs/qcom-lpass/va-macro/DMIC1EnableSeq.conf"
	Include.vadm1d.File "/codecs/qcom-lpass/va-macro/DMIC1DisableSeq.conf"

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},3"
	}
}

SectionDevice."Headset" {
	Comment "Headset Microphone Capture"

	ConflictingDevice [
		"Mic"
	]

	Include.wcdmice.File "/codecs/pm4125/HeadphoneMicEnableSeq.conf"
	Include.wcdmicd.File "/codecs/pm4125/HeadphoneMicDisableSeq.conf"
	Include.vamice.File "/codecs/qcom-lpass/va-macro/HeadphoneMicEnableSeq.conf"
	Include.vamicd.File "/codecs/qcom-lpass/va-macro/HeadphoneMicDisableSeq.conf"

	Value {
		CapturePriority 200
		CapturePCM "hw:${CardId},0"
		CaptureChannels 1
		CaptureMixer "default:${CardId}"
		CaptureMixerElem "ADC2"
		JackControl "Mic Jack"
		JackHWMute "Mic"
	}
}
