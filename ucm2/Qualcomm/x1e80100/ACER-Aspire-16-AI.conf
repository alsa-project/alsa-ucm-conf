# Acer Aspire 16 AI (A16-11M): two WSA8845 speakers on the WSA macro, the
# WCD9385 headset codec, two lid microphones on VA DMIC0 and DMIC1. By
# GenericCPU (omacom/omarchy#17555), from the ThinkPad T14s's two-speaker
# profile. The speaker amplifiers run at PA Volume 6 where the T14s's run at
# 12, because there is no Acer tuning for them.
Syntax 4

SectionUseCase."HiFi" {
	File "/Qualcomm/x1e80100/Aspire-16-AI-HiFi.conf"
	Comment "HiFi quality Music."
}

BootSequence [
	cset "name='HPHL Volume' 12"
	cset "name='HPHR Volume' 12"
	cset "name='ADC2 Volume' 8"
	cset "name='SpkrLeft PA Volume' 6"
	cset "name='SpkrRight PA Volume' 6"
]

Include.card-init.File "/lib/card-init.conf"
Include.ctl-remap.File "/lib/ctl-remap.conf"
Include.wcd-init.File "/codecs/wcd938x/init.conf"
Include.wsa-init.File "/codecs/wsa884x/two-speakers/init.conf"
Include.wsam-init.File "/codecs/qcom-lpass/wsa-macro/init.conf"
Include.rxm-init.File "/codecs/qcom-lpass/rx-macro/init.conf"
