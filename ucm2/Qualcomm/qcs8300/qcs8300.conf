Syntax 4

If.DMI_PRESENT {
    Condition {
        Type Path
        Mode read
        Path "/sys/devices/virtual/dmi/id/board_vendor"
    }

    True {
        Define.DMI_info "${sys:devices/virtual/dmi/id/board_vendor}-${sys:devices/virtual/dmi/id/board_name}"

        If.MONACOEVK_DMI_A {
            Condition {
                Type RegexMatch
                String "${var:DMI_info}"
                Regex "qcom.*Inc\. Monaco EVK"
            }
            True.Include.monaco.File "/Qualcomm/qcs8300/MONACO-EVK.conf"
        }
    }

    False {
        If.MONACOEVK_CARD {
            Condition {
                Type RegexMatch
                String "${CardLongName}"
                Regex "MONACO-EVK"
            }
            True.Include.monaco.File "/Qualcomm/qcs8300/MONACO-EVK.conf"
        }
     }
 }

