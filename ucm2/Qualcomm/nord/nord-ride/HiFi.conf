# Use case configuration for Qualcomm NORD-RIDE.

SectionVerb {
	EnableSequence [
		cset "name='AIF_TDM_RX_8 Audio Mixer MultiMedia1' 1"
		cset "name='MultiMedia2 Mixer AIF_TDM_TX_8' 1"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "DAC Speaker playback"

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackMixer "default:${CardId}"
		PlaybackChannels 2
	}
}

SectionDevice."Mic" {
	Comment "ADC Mic capture"

	EnableSequence [
		cset "name='ADC1 Highpass-Filter Capture Switch' 1"
		cset "name='ADC1 Capture Volume' 255"
	]

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},1"
	}
}
