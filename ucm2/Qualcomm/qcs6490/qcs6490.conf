Syntax 4

If.DMI_PRESENT {
    Condition {
        Type Path
        Mode read
        Path "/sys/devices/virtual/dmi/id/board_vendor"
    }

    True {
        Define.DMI_info "${sys:devices/virtual/dmi/id/board_vendor}-${sys:devices/virtual/dmi/id/board_name}"

        If.QCS6490_DMI_RB3 {
            Condition {
                Type RegexMatch
                String "${var:DMI_info}"
                Regex "qcom.*Inc\. Robotics RB3gen2"
            }
            True.Include.kodiak.File "/Qualcomm/qcs6490/QCS6490-RB3Gen2.conf"
        }
    }

    False {
        If.QCS6490RB3Gen2_CARD {
            Condition {
                Type RegexMatch
                String "${CardLongName}"
                Regex "QCS6490-RB3Gen2"
            }
            True.Include.kodiak.File "/Qualcomm/qcs6490/QCS6490-RB3Gen2.conf"
        }
     }
 }

