SectionVerb {
	EnableSequence [
		cset "name='SENARY_MI2S_RX Audio Mixer MultiMedia1' 1"
		cset "name='MultiMedia2 Mixer VA_CODEC_DMA_TX_0' 1"
	]

	DisableSequence [
		cset "name='SENARY_MI2S_RX Audio Mixer MultiMedia1' 0"
		cset "name='MultiMedia2 Mixer VA_CODEC_DMA_TX_0' 0"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speaker playback"

	EnableSequence [
		cset "name='Speaker Amp Switch' on"
	]

	DisableSequence [
		cset "name='Speaker Amp Switch' off"
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackMixer "default:${CardId}"
	}
}

SectionDevice."Earpiece" {
	Comment "Earpiece playback"

	EnableSequence [
		cset "name='Earpiece Amp Switch' on"
	]

	DisableSequence [
		cset "name='Earpiece Amp Switch' off"
	]

	Value {
		PlaybackPriority 50
		PlaybackPCM "hw:${CardId},0"
		PlaybackMixer "default:${CardId}"
	}
}

SectionDevice."Mic1" {
	Comment "Microphones"

	Include.vadm0e {
		File "/codecs/qcom-lpass/va-macro/DMIC0EnableSeq.conf"
		Before.EnableSequence "0"
	}
	Include.vadm0d.File "/codecs/qcom-lpass/va-macro/DMIC0DisableSeq.conf"
	Include.vadm1e {
		File "/codecs/qcom-lpass/va-macro/DMIC1EnableSeq.conf"
		Before.EnableSequence "0"
	}
	Include.vadm1d.File "/codecs/qcom-lpass/va-macro/DMIC1DisableSeq.conf"

	EnableSequence [
		cset "name='VA DMIC MUX0' DMIC1"
		cset "name='VA DMIC MUX1' DMIC3"
	]

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},1"
		CaptureChannels 2
		CaptureMixer "default:${CardId}"
	}
}
