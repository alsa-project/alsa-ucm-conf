Syntax 4

SectionUseCase."HiFi" {
	File "/Qualcomm/molokai/Vantage-HiFi.conf"
	Comment "HiFi quality Music."
}

BootSequence [
	cset "name='Speaker Amp Input' Right"
	cset "name='Earpiece Amp Input' Left"
	cset "name='Speaker Amp Switch' off"
	cset "name='Earpiece Amp Switch' off"
	cset "name='Speaker Playback Volume' 26"
	cset "name='Earpiece Playback Volume' 17"
]

Include.card-init.File "/lib/card-init.conf"
Include.ctl-remap.File "/lib/ctl-remap.conf"
