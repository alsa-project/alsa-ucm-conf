Syntax 4

If.DMI_PRESENT {
    Condition {
        Type Path
        Mode read
        Path "/sys/devices/virtual/dmi/id/board_vendor"
    }

    True {
        Define.DMI_info "${sys:devices/virtual/dmi/id/board_vendor}-${sys:devices/virtual/dmi/id/board_name}"

        If.LEMANSEVK_DMI_A {
            Condition {
                Type RegexMatch
                String "${var:DMI_info}"
                Regex "qcom.*Inc\. Lemans EVK"
            }
            True.Include.lemans.File "/Qualcomm/sa8775p/LEMANS-EVK.conf"
        }
    }

    False {
        If.LEMANSEVK_CARD {
            Condition {
                Type RegexMatch
                String "${CardLongName}"
                Regex "LEMANS-EVK"
            }
            True.Include.lemans.File "/Qualcomm/sa8775p/LEMANS-EVK.conf"
        }
     }
 }

