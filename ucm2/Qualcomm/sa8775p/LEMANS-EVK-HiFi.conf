SectionVerb {
	Value {
		TQ "HiFi"
	}
	EnableSequence [
		cset "name='PRIMARY_MI2S_RX Audio Mixer MultiMedia1' 1"
		cset "name='MultiMedia2 Mixer TERTIARY_MI2S_TX' 1"
		cset "name='DISPLAY_PORT_RX_0 Audio Mixer MultiMedia4' 1"
	]
}

SectionDevice."Speaker" {
	Comment "Speaker playback"

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackMixer "default:${CardId}"
		PlaybackMixerElem "Speakers"
	}
}

SectionDevice."Mic" {
	Comment "Mic"

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},1"
	}
}

SectionDevice."DP" {
	Comment "DP OUT"
	PlaybackChannels 2
	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},3"
	}

	EnableSequence [
		cset "name='DISPLAY_PORT_RX_0 Audio Mixer MultiMedia4' 1"
	]

	DisableSequence [
		cset "name='DISPLAY_PORT_RX_0 Audio Mixer MultiMedia4' 0"
	]
}
