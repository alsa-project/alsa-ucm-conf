Syntax 4

If.DMI_PRESENT {
    Condition {
        Type Path
        Mode read
        Path "/sys/devices/virtual/dmi/id/board_vendor"
    }

    True {
        Define.DMI_info "${sys:devices/virtual/dmi/id/board_vendor}-${sys:devices/virtual/dmi/id/board_name}"

        If.TALOSEVK_DMI_A {
            Condition {
                Type RegexMatch
                String "${var:DMI_info}"
                Regex "qcom.*Qualcomm QCS615 IQ 615 EVK"
            }
            True.Include.talos.File "/Qualcomm/qcs615/TALOS-EVK.conf"
        }
    }

    False {
        If.TALOSEVK_CARD {
            Condition {
                Type RegexMatch
                String "${CardLongName}"
                Regex "TALOS-EVK"
            }
            True.Include.talos.File "/Qualcomm/qcs615/TALOS-EVK.conf"
        }
     }
 }

