# Use case configuration for Lenovo ThinkPad T14s Gen 7 (Mahua).
# 2x WSA8845 speakers on swr0 + 2x DMICs via VA macro; two USB-C
# DisplayPort outputs (DP0/DP1) and one on-board HDMI (DP2 via
# Realtek RTD2171A DP-to-HDMI bridge).

SectionVerb {
	EnableSequence [
		cset "name='WSA_CODEC_DMA_RX_0 Audio Mixer MultiMedia1' 1"
		cset "name='DISPLAY_PORT_RX_0 Audio Mixer MultiMedia2' 0"
		cset "name='DISPLAY_PORT_RX_1 Audio Mixer MultiMedia2' 0"
		cset "name='DISPLAY_PORT_RX_2 Audio Mixer MultiMedia2' 0"
		cset "name='MultiMedia4 Mixer VA_CODEC_DMA_TX_0' 1"
	]

	Include.wsae.File "/codecs/wsa884x/two-speakers/DefaultEnableSeq.conf"
	Include.wsm1e.File "/codecs/qcom-lpass/wsa-macro/Wsa1SpeakerEnableSeq.conf"

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speaker playback"

	Include.wsmspk1e.File "/codecs/qcom-lpass/wsa-macro/Wsa1SpeakerEnableSeq.conf"
	Include.wsmspk1d.File "/codecs/qcom-lpass/wsa-macro/Wsa1SpeakerDisableSeq.conf"
	Include.wsaspk.File "/codecs/wsa884x/two-speakers/SpeakerSeq.conf"

	Value {
		PlaybackChannels 2
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackMixer "default:${CardId}"
		PlaybackMixerElem "Speakers"
	}
}

SectionDevice."Mic" {
	Comment "Internal microphones"

	Include.vadm0e.File "/codecs/qcom-lpass/va-macro/DMIC0EnableSeq.conf"
	Include.vadm0d.File "/codecs/qcom-lpass/va-macro/DMIC0DisableSeq.conf"
	Include.vadm1e.File "/codecs/qcom-lpass/va-macro/DMIC1EnableSeq.conf"
	Include.vadm1d.File "/codecs/qcom-lpass/va-macro/DMIC1DisableSeq.conf"

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},3"
	}
}

SectionDevice."HDMI0" {
	Comment "USB-C DisplayPort 0 playback"

	ConflictingDevice [
		"HDMI1"
		"HDMI2"
	]

	EnableSequence [
		cset "name='DISPLAY_PORT_RX_0 Audio Mixer MultiMedia2' 1"
		cset "name='DISPLAY_PORT_RX_1 Audio Mixer MultiMedia2' 0"
		cset "name='DISPLAY_PORT_RX_2 Audio Mixer MultiMedia2' 0"
	]

	DisableSequence [
		cset "name='DISPLAY_PORT_RX_0 Audio Mixer MultiMedia2' 0"
	]

	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},1"
		JackControl "DP0 Jack"
	}
}

SectionDevice."HDMI1" {
	Comment "USB-C DisplayPort 1 playback"

	ConflictingDevice [
		"HDMI0"
		"HDMI2"
	]

	EnableSequence [
		cset "name='DISPLAY_PORT_RX_0 Audio Mixer MultiMedia2' 0"
		cset "name='DISPLAY_PORT_RX_1 Audio Mixer MultiMedia2' 1"
		cset "name='DISPLAY_PORT_RX_2 Audio Mixer MultiMedia2' 0"
	]

	DisableSequence [
		cset "name='DISPLAY_PORT_RX_1 Audio Mixer MultiMedia2' 0"
	]

	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},1"
		JackControl "DP1 Jack"
	}
}

SectionDevice."HDMI2" {
	Comment "On-board HDMI playback (DP2 via RTD2171A)"

	ConflictingDevice [
		"HDMI0"
		"HDMI1"
	]

	EnableSequence [
		cset "name='DISPLAY_PORT_RX_0 Audio Mixer MultiMedia2' 0"
		cset "name='DISPLAY_PORT_RX_1 Audio Mixer MultiMedia2' 0"
		cset "name='DISPLAY_PORT_RX_2 Audio Mixer MultiMedia2' 1"
	]

	DisableSequence [
		cset "name='DISPLAY_PORT_RX_2 Audio Mixer MultiMedia2' 0"
	]

	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},1"
		JackControl "DP2 Jack"
	}
}
