# Use case configuration for Lenovo ThinkPad T14s Gen 7 (Snapdragon X2 Elite).
#
# Speaker, HDMI0 and HDMI1 share the MultiMedia1 PCM and switch its route
# between WSA_CODEC_DMA_RX_0 and DISPLAY_PORT_RX_0/1, like the x1e80100
# profiles do for headphones and DP. The topology also has dedicated
# MultiMedia3/4 -> DISPLAY_PORT_RX_0/1 streams, but exposing them as separate
# PCMs lets any client start a DisplayPort stream while no display is
# attached; that start fails in the DSP ("Failed to start APM port") and
# afterwards nothing on the card produces audio until it is rebound. With the
# DP outputs as jack-gated ports of the one sink, the DP route is only ever
# enabled while the display is present.

SectionVerb {
	EnableSequence [
		cset "name='WSA_CODEC_DMA_RX_0 Audio Mixer MultiMedia1' 1"
		cset "name='DISPLAY_PORT_RX_0 Audio Mixer MultiMedia1' 0"
		cset "name='DISPLAY_PORT_RX_1 Audio Mixer MultiMedia1' 0"
		cset "name='MultiMedia2 Mixer VA_CODEC_DMA_TX_0' 1"
	]

	Include.wsae.File "/codecs/wsa884x/two-speakers/DefaultEnableSeq.conf"
	Include.wsm1e.File "/codecs/qcom-lpass/wsa-macro/Wsa1SpeakerEnableSeq.conf"

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speaker playback"

	ConflictingDevice [
		"HDMI0"
		"HDMI1"
	]

	Include.wsmspk1e.File "/codecs/qcom-lpass/wsa-macro/Wsa1SpeakerEnableSeq.conf"
	Include.wsmspk1d.File "/codecs/qcom-lpass/wsa-macro/Wsa1SpeakerDisableSeq.conf"
	Include.wsaspk.File "/codecs/wsa884x/two-speakers/SpeakerSeq.conf"

	EnableSequence [
		cset "name='DISPLAY_PORT_RX_0 Audio Mixer MultiMedia1' 0"
		cset "name='DISPLAY_PORT_RX_1 Audio Mixer MultiMedia1' 0"
		cset "name='WSA_CODEC_DMA_RX_0 Audio Mixer MultiMedia1' 1"
	]

	DisableSequence [
		cset "name='WSA_CODEC_DMA_RX_0 Audio Mixer MultiMedia1' 0"
	]

	Value {
		PlaybackChannels 2
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackMixer "default:${CardId}"
		PlaybackMixerElem "Speakers"
	}
}

SectionDevice."Mic" {
	Comment "Internal microphones"

	Include.vadm0e.File "/codecs/qcom-lpass/va-macro/DMIC0EnableSeq.conf"
	Include.vadm0d.File "/codecs/qcom-lpass/va-macro/DMIC0DisableSeq.conf"
	Include.vadm1e.File "/codecs/qcom-lpass/va-macro/DMIC1EnableSeq.conf"
	Include.vadm1d.File "/codecs/qcom-lpass/va-macro/DMIC1DisableSeq.conf"

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},1"
	}
}

SectionDevice."HDMI0" {
	Comment "USB/DisplayPort 0 playback"

	ConflictingDevice [
		"Speaker"
		"HDMI1"
	]

	EnableSequence [
		cset "name='WSA_CODEC_DMA_RX_0 Audio Mixer MultiMedia1' 0"
		cset "name='DISPLAY_PORT_RX_1 Audio Mixer MultiMedia1' 0"
		cset "name='DISPLAY_PORT_RX_0 Audio Mixer MultiMedia1' 1"
	]

	DisableSequence [
		cset "name='DISPLAY_PORT_RX_0 Audio Mixer MultiMedia1' 0"
	]

	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},0"
		JackControl "DP0 Jack"
	}
}

SectionDevice."HDMI1" {
	Comment "USB/DisplayPort 1 playback"

	ConflictingDevice [
		"Speaker"
		"HDMI0"
	]

	EnableSequence [
		cset "name='WSA_CODEC_DMA_RX_0 Audio Mixer MultiMedia1' 0"
		cset "name='DISPLAY_PORT_RX_0 Audio Mixer MultiMedia1' 0"
		cset "name='DISPLAY_PORT_RX_1 Audio Mixer MultiMedia1' 1"
	]

	DisableSequence [
		cset "name='DISPLAY_PORT_RX_1 Audio Mixer MultiMedia1' 0"
	]

	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},0"
		JackControl "DP1 Jack"
	}
}
